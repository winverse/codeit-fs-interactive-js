<!DOCTYPE html>
<html>
  <head>
    <title>이벤트와 버튼 클릭</title>
    <style>
      .liked {
        color: red;
      }
      .block {
        margin: 20px 0;
        padding: 10px;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <!-- 1. 좋아요 버튼 예제 -->
    <div class="block">
      <h3>1. 좋아요 버튼</h3>
      <button id="likeBtn">좋아요</button>
      <p id="likeCount">좋아요 0개</p>
    </div>

    <!-- 2. 카운트 버튼 예제 -->
    <div class="block">
      <h3>2. 카운터 버튼</h3>
      <button id="countBtn">클릭 횟수: 0</button>
    </div>

    <script src="index.js"></script>
  </body>
</html>
