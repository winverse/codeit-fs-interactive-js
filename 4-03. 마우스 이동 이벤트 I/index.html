<!DOCTYPE html>
<html>
  <head>
    <title>마우스 이동 이벤트 I</title>
    <style>
      .block {
        margin: 20px 0;
        padding: 10px;
        border-bottom: 1px solid #eee;
      }

      #follower {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: tomato;
        pointer-events: none;
      }

      #zone {
        width: 300px;
        height: 300px;
        background: lightblue;
      }
    </style>
  </head>
  <body>
    <!-- 1. 마우스 이동 이벤트 예제 -->
    <div class="block">
      <h3>1. 마우스 좌표 추적</h3>
      <div
        id="box"
        style="
          width: 200px;
          height: 200px;
          background: lightgreen;
        "
      >
        마우스를 움직여보세요
      </div>
      <p id="coordinates">좌표:</p>
    </div>

    <div id="follower"></div>
    <div id="zone">특정 영역 감지</div>
    <p id="info">좌표 정보</p>

    <script src="index.js"></script>
  </body>
</html>
